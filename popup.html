<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppression des aperçus IA</title>
    <link rel="stylesheet" href="style.css">

    <script src="./popup.js" defer></script>
</head>
<body>
    <main class="popup-shell">
        <header class="app-header">
            <div class="brand-mark" aria-hidden="true">AO</div>
            <div>
                <p class="eyebrow">Utilitaire de navigateur</p>
                <h1>Suppression des<br>aperçus IA</h1>
            </div>
        </header>

        <section class="status-panel" aria-labelledby="status-title">
            <div class="status-copy">
                <p class="section-label">État de la protection</p>
                <h2 id="status-title">Les résultats IA sont <span id="status-description">visibles</span></h2>
                <p class="status-note">S’applique aux résultats de recherche Google</p>
            </div>
            <button class="status" id="btn" type="button" aria-pressed="false">
                <span class="status-indicator" aria-hidden="true"></span>
                <span id="status-label">Désactivée</span>
            </button>
        </section>

        <footer class="app-footer">
            <span>Simple. Ciblée. À vous.</span>
            <a id="source-code-link" href="https://github.com/RayanEreteo/AI-Overview-remover" target="_blank" rel="noopener noreferrer">Voir le code source <span aria-hidden="true">&#8599;</span></a>
        </footer>
    </main>
</body>
</html>
